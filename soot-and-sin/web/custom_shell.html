<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b09">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    :root {
      color-scheme: dark;
      --coal: #080b09;
      --ink: #ded5bf;
      --dim: #827d70;
      --brass: #b48b49;
      --line: rgba(180, 139, 73, .32);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--coal);
    }

    body {
      font-family: Georgia, "Noto Serif TC", "Microsoft JhengHei", serif;
      color: var(--ink);
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      outline: none;
      transition: opacity .35s ease;
    }

    body.game-ready #canvas { opacity: 1; }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background:
        linear-gradient(rgba(7, 10, 8, .82), rgba(7, 10, 8, .96)),
        repeating-linear-gradient(112deg, transparent 0 13px, rgba(222, 213, 191, .018) 14px 15px),
        radial-gradient(circle at 50% 28%, #273128 0, #080b09 52%);
      transition: opacity .35s ease, visibility .35s ease;
    }

    body.game-ready .loading {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .plate {
      position: relative;
      width: min(560px, 100%);
      padding: clamp(34px, 8vw, 62px);
      border: 1px solid var(--line);
      background: rgba(10, 14, 11, .78);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .48), inset 0 0 0 5px rgba(180, 139, 73, .035);
      text-align: center;
    }

    .plate::before,
    .plate::after {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--brass), transparent);
      opacity: .65;
    }

    .plate::before { top: 18px; }
    .plate::after { bottom: 18px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--brass);
      font: 700 11px/1.4 "Courier New", monospace;
      letter-spacing: .22em;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 58px);
      font-weight: 400;
      letter-spacing: .08em;
    }

    .ornament {
      margin: 18px 0 20px;
      color: var(--brass);
      font-size: 14px;
      letter-spacing: .6em;
    }

    #load-status {
      min-height: 1.5em;
      margin: 0 0 16px;
      color: var(--dim);
      font-size: 14px;
      letter-spacing: .08em;
    }

    .track {
      height: 5px;
      overflow: hidden;
      border: 1px solid rgba(180, 139, 73, .25);
      background: #030504;
    }

    #load-bar {
      display: block;
      width: 3%;
      height: 100%;
      background: linear-gradient(90deg, #765729, #d1ad68);
      box-shadow: 0 0 16px rgba(209, 173, 104, .35);
      transition: width .12s linear;
    }

    #retry {
      display: none;
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      border: 1px solid var(--brass);
      color: var(--ink);
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    body.load-failed #retry,
    body.load-stalled #retry { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="煤灰與惡遊戲畫面"></canvas>
  <main class="loading" aria-live="polite">
    <section class="plate">
      <p class="eyebrow">SOOT AND SIN</p>
      <h1>煤灰與惡</h1>
      <div class="ornament">◇ ─ ◇</div>
      <p id="load-status">正在穿過煤霧……</p>
      <div class="track"><i id="load-bar"></i></div>
      <button id="retry" type="button">重新進入</button>
    </section>
  </main>

  <script src="$GODOT_URL"></script>
  <script>
    (() => {
      const status = document.querySelector('#load-status');
      const bar = document.querySelector('#load-bar');
      const retry = document.querySelector('#retry');
      const engine = new Engine($GODOT_CONFIG);
      const STALL_NOTICE_MS = 20000;
      let lastProgressAt = Date.now();
      let gameStarted = false;

      const setProgress = (current, total) => {
        lastProgressAt = Date.now();
        document.body.classList.remove('load-stalled');
        if (total > 0) {
          const ratio = Math.max(0.03, Math.min(1, current / total));
          bar.style.width = `${Math.round(ratio * 100)}%`;
          const percent = Math.round(ratio * 100);
          status.textContent = ratio < .7
            ? `正在穿過煤霧…… ${percent}%`
            : `正在翻開旅途紀錄…… ${percent}%`;
        } else {
          bar.style.width = '42%';
        }
      };

      const fail = (error) => {
        console.error(error);
        document.body.classList.add('load-failed');
        status.textContent = '道路暫時中斷，請稍後再試。';
      };

      const start = async () => {
        if (!Engine.isWebGLAvailable()) {
          fail(new Error('WebGL is unavailable.'));
          return;
        }
        try {
          await engine.startGame({
            canvas: document.querySelector('#canvas'),
            onProgress: setProgress,
          });
          gameStarted = true;
          bar.style.width = '100%';
          document.body.classList.add('game-ready');
          document.querySelector('#canvas').focus();
        } catch (error) {
          fail(error);
        }
      };

      window.setInterval(() => {
        if (gameStarted || document.body.classList.contains('load-failed')) return;
        if (Date.now() - lastProgressAt < STALL_NOTICE_MS) return;
        document.body.classList.add('load-stalled');
        status.textContent = '煤霧暫時沒有散去，可以重新進入。';
      }, 1000);

      retry.addEventListener('click', () => {
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('retry', Date.now().toString());
        window.location.replace(nextUrl);
      });
      start();
    })();
  </script>
</body>
</html>
