<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080806">
  <title>煤灰與惡｜章節選擇美術原型</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body data-theme="saints">
  <div class="world-haze" aria-hidden="true"></div>
  <main class="prototype-shell">
    <header class="prototype-masthead">
      <div>
        <p>SOOT AND SIN · CHAPTER ARCHIVE</p>
        <h1>章節選擇</h1>
        <span>露西亞・艾弗里 · CHAPTER I</span>
      </div>
      <a href="../../" aria-label="返回測試入口">返回測試入口 <b>↗</b></a>
    </header>

    <section class="prototype-stage" id="prototypeStage" aria-live="polite"></section>

    <footer class="prototype-footer">
      <span>露西亞・艾弗里</span>
      <span>CHAPTER I · 01 / 06</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="death-reveal" id="deathReveal" hidden aria-hidden="true">
    <div class="death-flash"></div>
    <div class="death-card">
      <small>CHAPTER RESET</small>
      <span class="death-mark">†</span>
      <h2>本章進度已重置</h2>
      <p>物資、線索與小節進度已清空。</p>
      <strong>返回第一節</strong>
    </div>
  </div>

  <script src="app.js?v=6"></script>
</body>
</html>
